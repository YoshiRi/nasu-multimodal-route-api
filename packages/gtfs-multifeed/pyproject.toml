[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtfs-multifeed"
version = "0.1.0"
description = "Query GTFS feeds from multiple transit operators as a single network."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["gtfs", "transit", "public-transport", "timetable"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "httpx>=0.27",
    "pandas>=2.2",
]

[project.scripts]
gtfs-multifeed = "gtfs_multifeed.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
