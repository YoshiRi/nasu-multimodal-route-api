<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Nasu Route Debug UI</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="map"></div>

  <div id="panel">
    <div class="panel-section">
      <strong>停留所検索</strong>
      <input id="stop-search" type="text" placeholder="停留所名で検索..." autocomplete="off" />
      <div id="stop-search-results"></div>
    </div>

    <div class="panel-section">
      <strong>スポット追加</strong>
      <button id="add-spot-toggle">地図クリックで追加: OFF</button>
      <div id="add-spot-form" hidden>
        <input id="add-spot-name" type="text" placeholder="スポット名" />
        <div id="add-spot-coords"></div>
        <button id="add-spot-submit">追加</button>
        <button id="add-spot-cancel">キャンセル</button>
      </div>
    </div>

    <div class="panel-section">
      <strong>ルート作成</strong>
      <button id="route-mode-toggle">ルート作成モード: OFF</button>
      <div id="route-selection-list"></div>
    </div>

    <div class="panel-section">
      <strong>日付・時刻</strong>
      <input id="plan-date" type="date" />
      <input id="plan-time" type="time" value="09:00" />
    </div>

    <div class="panel-section">
      <strong>バス乗り継ぎの余裕（分）</strong>
      <input id="transfer-buffer" type="number" min="0" max="60" step="1" value="0" />
      <button id="route-search-submit" disabled>この行程を検索</button>
    </div>

    <div class="panel-section" id="status"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
