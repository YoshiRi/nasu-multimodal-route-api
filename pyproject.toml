[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nasu-multimodal-route-api"
version = "0.1.0"
description = "PoC multimodal route planning API for the Nasu area using GTFS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "gtfs-kit>=10.0",
    "httpx>=0.27",
    "pandas>=2.2",
    "pydantic>=2.7",
    "uvicorn[standard]>=0.29",
]

[project.scripts]
nasu-route = "app.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
